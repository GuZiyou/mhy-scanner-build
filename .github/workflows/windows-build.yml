name: Windows Build

on:
  push:
    branches: [ "main" ]
    tags: ["v*"]
  workflow_dispatch:
env:
  BUILD_CONFIGURATION: Release
  INSTALL_DIR: ${{ github.workspace }}\install
  ZIP_NAME: MHY_Scanner_${{ github.ref_name }}.zip
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Configure CMake
        run: |
          cmake -B build `
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIGURATION }} `
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake `
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}\install `
          -DUNIT_TESTS=OFF `
          -DDEV=OFF

      - name: Build
        run: |
          cmake --build build --config ${{ env.BUILD_CONFIGURATION }} --parallel

      - name: Install
        run: |
          cmake --install build --config ${{ env.BUILD_CONFIGURATION }}

      - name: Trim debug symbols (halves artifact size and zip time)
        shell: pwsh
        run: |
          $n = 0
          Get-ChildItem -Path "${{ env.INSTALL_DIR }}" -Recurse -Filter *.pdb -ErrorAction SilentlyContinue |
            ForEach-Object { Remove-Item $_.FullName -Force; $n++ }
          Write-Host "removed $n pdb file(s)"

      - name: Create ZIP
        shell: pwsh
        run: |
          $zip = "${{ github.workspace }}\${{ env.ZIP_NAME }}"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { $sevenZip = '7z' }
          & $sevenZip a -tzip -mx5 -bso0 -bsp0 $zip "${{ env.INSTALL_DIR }}\*"
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
          Write-Host "zip size: $([math]::Round((Get-Item $zip).Length/1MB,1)) MB"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ github.workspace }}\${{ env.ZIP_NAME }}
          retention-days: 5

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: ${{ github.workspace }}\${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}